name: Build Windows .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Compilar con PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name InmoScout
          --collect-submodules app
          --add-data "app/ui/assets;app/ui/assets"
          main.py

      - name: Comprimir
        run: Compress-Archive -Path dist/InmoScout -DestinationPath InmoScout-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: InmoScout-windows
          path: InmoScout-windows.zip

      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: InmoScout-windows.zip
